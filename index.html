<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n4nkh Terminal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fdf6e3;
      --text-color: #000000;
      --border-color: #000000;
      --cmd-color: #2b7a4b;
      --dir-color: #1a5fb4;
      --err-color: #a51d2d;
    }

    [data-theme="dark"] {
      --bg-color: #0d1117;
      --text-color: #c9d1d9;
      --border-color: #30363d;
      --cmd-color: #3fb950;
      --dir-color: #58a6ff;
      --err-color: #f85149;
    }

    [data-theme="dark"] .terminal {
      background-color: #161b22;
      box-shadow: 4px 4px 0 var(--border-color);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* CRT Overlay Effect */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .terminal {
      background-color: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      box-shadow: 4px 4px 0 var(--border-color);
      padding: 20px;
      max-width: 800px;
      width: 100%;
      height: 90vh;
      display: flex;
      flex-direction: column;
      position: absolute;
      /* Changed for draggable */
      transition: all 0.3s ease;
      z-index: 10;
    }

    .terminal-content {
      flex: 1;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .terminal-content::-webkit-scrollbar {
      display: none;
    }

    /* Terminal States */
    .terminal.maximized {
      max-width: none;
      width: 100vw;
      height: 100vh;
      top: 0 !important;
      left: 0 !important;
      border-radius: 0;
      border: none;
      box-shadow: none;
      padding: 20px 40px;
    }

    .terminal.minimized {
      height: 50px;
      width: 250px;
      top: auto !important;
      bottom: 20px !important;
      left: 20px !important;
      padding: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .terminal.minimized .terminal-content {
      display: none;
    }

    .terminal.closed {
      display: none;
    }

    .closed-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: black;
      color: #00ff00;
      font-family: monospace;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
    }

    .closed-screen.active {
      display: flex;
    }

    @media (max-width: 768px) {
      .terminal {
        height: 85vh;
        padding: 15px;
      }

      body {
        padding: 10px;
      }
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 3px solid var(--border-color);
      border-bottom-style: dashed;
      margin-bottom: 15px;
      font-weight: 700;
      cursor: grab;
      /* Draggable cursor */
      flex-shrink: 0;
    }

    .terminal-header:active {
      cursor: grabbing;
    }

    .terminal-controls span {
      display: inline-block;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      margin-right: 8px;
      border: 2px solid var(--border-color);
      cursor: pointer;
    }

    .terminal-controls span:hover {
      opacity: 0.8;
    }

    .control-close {
      background-color: #ff5f56;
      transform: rotate(1deg);
    }

    .control-minimize {
      background-color: #ffbd2e;
      transform: rotate(-1deg);
    }

    .control-maximize {
      background-color: #27c93f;
      transform: rotate(0.5deg);
    }

    #input-area {
      display: flex;
      align-items: center;
      padding-top: 10px;
      border-top: 2px dashed var(--border-color);
      margin-top: 10px;
      flex-shrink: 0;
    }

    #prompt {
      color: var(--dir-color);
      margin-right: 5px;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .command-input {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      outline: none;
      flex: 1;
      min-width: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .command-output {
      margin-bottom: 10px;
      word-break: break-word;
    }

    .cmd-text {
      color: var(--cmd-color);
      font-weight: bold;
    }

    .err-text {
      color: var(--err-color);
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      color: var(--text-color);
      text-decoration: none;
      margin-right: 10px;
      transition: all 0.2s;
    }

    .social-icon i {
      margin-right: 8px;
    }

    .social-icon:hover {
      text-shadow: 0 0 8px var(--dir-color);
      color: var(--dir-color);
    }

    /* Canvas for Matrix */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      display: none;
      background: black;
    }

    .ascii-art {
      font-family: 'Courier New', monospace;
      white-space: pre;
      font-size: 11px;
      line-height: 1.2;
      overflow-x: hidden;
      overflow-y: hidden;
      background: transparent;
      padding: 15px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      border-style: solid;
      margin: 10px 0;
      word-wrap: break-word;
    }

    /* Typewriter Cursor */
    .typewriter-cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
      margin-left: 2px;
      opacity: 0.7;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="closed-screen" id="closed-screen">
    <div>Connection closed. Click anywhere to reconnect...</div>
  </div>

  <canvas id="matrix-canvas"></canvas>

  <div class="terminal" id="terminal">
    <div class="terminal-header" id="terminal-header">
      <div class="terminal-controls">
        <span class="control-close" id="btn-close" title="Close"></span>
        <span class="control-minimize" id="btn-minimize" title="Minimize"></span>
        <span class="control-maximize" id="btn-maximize" title="Maximize"></span>
      </div>
      <div><i class="fas fa-terminal"></i> n4nkh Terminal</div>
    </div>

    <div class="terminal-content" id="terminal-content">
      <div id="output-area"></div>
      <div id="input-area" style="display: none;">
        <span id="prompt">n4nkh@terminal ~$</span>
        <input type="text" class="command-input" id="command-input" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const terminal = document.getElementById('terminal');
      const terminalHeader = document.getElementById('terminal-header');
      const outputArea = document.getElementById('output-area');
      const inputArea = document.getElementById('input-area');
      const input = document.getElementById('command-input');
      const closedScreen = document.getElementById('closed-screen');
      const terminalContent = document.getElementById('terminal-content');

      let commandHistory = [];
      let historyIndex = -1;
      let currentTheme = 'light';
      let isBooting = true;
      let isTyping = false; // Prevent input while typewriter effect is running

      const availableCommands = [
        'whoami', 'contact', 'resume', 'certifications', 'tools',
        'writeups', 'projects', 'skills', 'history', 'echo',
        'date', 'matrix', 'banner', 'theme', 'quote', 'clear', 'help'
      ];

      const securityQuotes = [
        "Security is not a product, but a process. - Bruce Schneier",
        "The only secure computer is one that's unplugged, locked in a safe, and buried 20 feet underground. - Dennis Huges",
        "Passwords are like underwear: you don't let people see it, you should change it very often, and you shouldn't share it with strangers. - Chris Pirillo",
        "There are two types of companies: those that have been hacked, and those that will be. - Robert Mueller",
        "Security is always excessive until it's not enough. - Robbie Sinclair",
        "Cybersecurity is much more than a matter of IT. - Stephane Nappo",
        "If you think technology can solve your security problems, then you don't understand the problems and you don't understand the technology. - Bruce Schneier",
        "Hacking is not a crime, it’s a skillset. What matters is how you use it. - Unknown"
      ];

      // Auto-focus Input whenever user clicks anywhere outside of terminal controls
      document.addEventListener('click', (e) => {
        if (!isBooting && !isTyping && !terminal.classList.contains('closed') && !terminal.classList.contains('minimized')) {
          // Don't focus if selecting text
          if (window.getSelection().toString() === "") {
            input.focus();
          }
        }
      });

      // Boot Sequence
      const bootLines = [
        "Initializing boot sequence...",
        "[OK] Loading kernel modules",
        "[OK] Mounting virtual filesystems",
        "[OK] Starting networking module",
        "Establishing secure connection to n4nkh.id.vn...",
        "Connection established. Authenticating...",
        "[OK] Access Granted."
      ];

      async function runBootSequence() {
        for (const line of bootLines) {
          const div = document.createElement('div');
          div.className = 'command-output text-muted';
          div.textContent = line;
          outputArea.appendChild(div);
          scrollToBottom();
          await new Promise(r => setTimeout(r, Math.random() * 200 + 100));
        }

        outputArea.innerHTML = '';

        const welcomeHTML = `
        <div class="mb-3">
          <h5>Welcome to n4nkh Terminal</h5>
          <p class="text-muted mb-1">Web Pentester & Red Teaming</p>
          <p class="text-muted">Type <code class="cmd-text">help</code> to see available commands to get started.</p>
        </div>
      `;
        const welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'command-output';
        welcomeDiv.innerHTML = welcomeHTML;
        outputArea.appendChild(welcomeDiv);

        isBooting = false;
        inputArea.style.display = 'flex';
        input.focus();
      }

      runBootSequence();

      // Keydown Handling (Enter, History, Tab Completion)
      input.addEventListener('keydown', (event) => {
        if (isTyping) {
          event.preventDefault();
          return;
        }

        if (event.key === 'Enter') {
          const command = input.value.trim();
          if (command) {
            commandHistory.unshift(command);
            if (commandHistory.length > 50) commandHistory.pop();
          }
          input.value = '';
          historyIndex = -1;
          handleCommand(command);
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (historyIndex < commandHistory.length - 1) {
            historyIndex++;
            input.value = commandHistory[historyIndex] || '';
          }
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (historyIndex > -1) {
            historyIndex--;
            input.value = historyIndex === -1 ? '' : commandHistory[historyIndex];
          }
        } else if (event.key === 'Tab') {
          event.preventDefault(); // Prevent changing focus
          const currentVal = input.value.toLowerCase();
          if (!currentVal) return;

          // Find matching commands
          const matches = availableCommands.filter(cmd => cmd.startsWith(currentVal));
          if (matches.length === 1) {
            input.value = matches[0] + ' ';
          } else if (matches.length > 1) {
            // Show matches
            const outputDiv = document.createElement('div');
            outputDiv.className = 'command-output';
            outputDiv.innerHTML = `<span id="prompt">n4nkh@terminal ~$</span> ${input.value}<br><span class="text-muted">${matches.join('  ')}</span>`;
            outputArea.appendChild(outputDiv);
            scrollToBottom();
          }
        }
      });

      function scrollToBottom() {
        terminalContent.scrollTop = terminalContent.scrollHeight;
      }

      // Typewriter effect for output
      async function typeWriterOutput(outputHtml, speed = 5) {
        isTyping = true;
        input.disabled = true;

        const outputDiv = document.createElement('div');
        outputDiv.className = 'command-output';
        outputArea.appendChild(outputDiv);

        // We'll just insert HTML instantly for complex layouts but simulate typing for plain text
        // For simplicity with HTML output, we can fade it in or type it if it doesn't have tags
        if (outputHtml.includes('<') && outputHtml.includes('>')) {
          // Instant output for HTML content
          outputDiv.innerHTML = outputHtml;
          scrollToBottom();
          await new Promise(r => setTimeout(r, 100)); // slight delay
        } else {
          // Real typewriter for plain text
          outputDiv.classList.add('typewriter-cursor');
          let i = 0;
          while (i < outputHtml.length) {
            // Handle HTML entities roughly
            if (outputHtml[i] === '&') {
              let end = outputHtml.indexOf(';', i);
              if (end !== -1) {
                outputDiv.innerHTML += outputHtml.substring(i, end + 1);
                i = end + 1;
                continue;
              }
            }
            outputDiv.innerHTML += outputHtml.charAt(i);
            i++;
            if (i % 3 === 0) scrollToBottom();
            await new Promise(r => setTimeout(r, speed));
          }
          outputDiv.classList.remove('typewriter-cursor');
        }

        isTyping = false;
        input.disabled = false;
        input.focus();
        scrollToBottom();
      }

      async function handleCommand(command) {
        // Echo the command
        const cmdEcho = document.createElement('div');
        cmdEcho.className = 'command-output';
        cmdEcho.innerHTML = `<span id="prompt">n4nkh@terminal ~$</span> <span class="cmd-text">${command}</span>`;
        outputArea.appendChild(cmdEcho);
        scrollToBottom();

        if (!command) return;

        let output = '';
        const parts = command.split(' ');
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1).join(' ');

        switch (cmd) {
          case 'whoami':
            output = `<div class="mt-2"><h5>Nguyễn An Khánh</h5><p>Web Pentester & Red Teaming</p><a href="https://n4nkh.id.vn" class="social-icon" target="_blank"><i class="fas fa-globe"></i> n4nkh.id.vn</a></div>`;
            break;
          case 'contact':
            output = `<div class="mt-2"><h5>📫 Contact</h5><a href="mailto:ankhanh.v09@gmail.com" class="social-icon"><i class="fas fa-envelope"></i> ankhanh.v09@gmail.com</a><br><a href="https://github.com/Saudadeeee" class="social-icon" target="_blank"><i class="fab fa-github"></i> Saudadeeee</a><br><a href="https://x.com/Nankhanh_" class="social-icon" target="_blank"><i class="fab fa-twitter"></i> @Nankhanh_</a><br><a href="https://www.linkedin.com/in/nguy%E1%BB%85n-kh%C3%A1nh-0ba5a215a/" class="social-icon" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a></div>`;
            break;
          case 'resume':
            output = `<div class="mt-2"><h5>📄 Resume - Nguyen An Khanh</h5><strong>Personal Info:</strong><ul><li>📅 Born: October 9, 2004</li><li>📍 Tu Lien, Tay Ho, Hanoi, Vietnam</li><li>📞 086 263 6728</li><li>📧 ankhanh.v09@gmail.com</li></ul><strong>Education:</strong><ul><li>🎓 <strong>Hanoi University of Science and Technology (HUST)</strong></li><li>📚 Major: Smart Embedded Systems and IoT</li><li>🏫 School of Electronics and Telecommunications (K67)</li><li>📅 2022 - Present (3rd Year Student)</li></ul><strong>About Me:</strong><p>I am a 3rd-year student at Hanoi University of Science and Technology with a deep passion for cybersecurity, particularly in penetration testing and red team activities. I am always eager to explore how systems can be attacked and how to protect them from potential threats.</p></div>`;
            break;
          case 'certifications':
            output = `<div class="mt-2"><h5>🏆 Certifications</h5><ul><li>CompTIA Security+ (In Progress)</li><li>eJPT - eLearnSecurity Junior Penetration Tester (Planned)</li><li>TryHackMe Top 5% Rank</li></ul></div>`;
            break;
          case 'tools':
            output = `<div class="mt-2"><h5>🛠️ Pentesting Tools</h5><strong>Web Application:</strong><ul><li>Burp Suite Pro, OWASP ZAP</li><li>Sqlmap, Gobuster, Dirbuster</li><li>Nikto, Wfuzz, Ffuf</li></ul><strong>Network:</strong><ul><li>Nmap, Masscan, Nessus</li><li>Metasploit, Cobalt Strike</li><li>Wireshark, Tcpdump</li></ul></div>`;
            break;
          case 'writeups':
            output = `<div class="mt-2"><h5>📝 Writeups & Blogs</h5><ul><li><a href="#" class="social-icon">HackTheBox - [Machine Name] Writeup</a></li><li><a href="#" class="social-icon">TryHackMe - Advanced Exploitation</a></li><li><a href="#" class="social-icon">Bypass WAF using obscure techniques</a></li></ul><p class="text-muted">Links will be updated soon!</p></div>`;
            break;
          case 'history':
            output = `<div class="mt-2"><h5>📜 Command History</h5>`;
            if (commandHistory.length === 0) {
              output += '<p>No commands in history</p>';
            } else {
              output += '<ol>';
              commandHistory.slice(0, 10).forEach(c => {
                output += `<li><code>${c}</code></li>`;
              });
              output += '</ol>';
            }
            output += '</div>';
            break;
          case 'echo':
            output = args || '';
            break;
          case 'date':
            output = new Date().toString();
            break;
          case 'matrix':
            startMatrix();
            return; // return early, matrix handles focus
          case 'banner':
            output = `<div class="mt-2 ascii-art">╔═══════════════════════════════════════╗
║              n4nkh Terminal           ║
╠═══════════════════════════════════════╣
║        Web Pentester & Red Team       ║
╚═══════════════════════════════════════╝</div>`;
            break;
          case 'theme':
            toggleTheme();
            output = `Theme switched to ${currentTheme} mode`;
            break;
          case 'quote':
            output = `<em>"${securityQuotes[Math.floor(Math.random() * securityQuotes.length)]}"</em>`;
            break;
          case 'help':
            output = `<div class="mt-2"><strong>Available commands:</strong>
          <div style="column-count: 2; column-gap: 20px; margin-top: 10px;">
          <ul style="list-style:none; padding-left:0;">
            <li><code class="cmd-text">whoami</code> - Info about me</li>
            <li><code class="cmd-text">contact</code> - Contact info</li>
            <li><code class="cmd-text">resume</code> - CV details</li>
            <li><code class="cmd-text">certifications</code> - Security certs</li>
            <li><code class="cmd-text">tools</code> - Pentesting tools</li>
            <li><code class="cmd-text">writeups</code> - Security blog posts</li>
            <li><code class="cmd-text">projects</code> - My projects</li>
            <li><code class="cmd-text">skills</code> - My skillset</li>
            <li><code class="cmd-text">history</code> - Command history</li>
            <li><code class="cmd-text">echo text</code> - Print text</li>
            <li><code class="cmd-text">date</code> - View time</li>
            <li><code class="cmd-text">matrix</code> - Matrix rain effect</li>
            <li><code class="cmd-text">banner</code> - ASCII banner</li>
            <li><code class="cmd-text">theme</code> - Toggle dark/light</li>
            <li><code class="cmd-text">quote</code> - Random quote</li>
            <li><code class="cmd-text">clear</code> - Clear terminal</li>
          </ul></div></div>`;
            break;
          case 'projects':
            output = `<div class="mt-2"><h5>📁 Projects</h5><ul><li>Bug Bounty Automation Scripts</li><li>Custom Red Team Toolkits</li><li>Browser Exploitation Labs</li></ul></div>`;
            break;
          case 'skills':
            output = `<div class="mt-2"><h5>🛠️ Skills</h5><ul><li>Web Pentesting (OWASP Top 10)</li><li>Red Teaming & Adversary Simulation</li><li>Python, Bash, JavaScript</li><li>CTF & Reverse Engineering</li></ul></div>`;
            break;
          case 'clear':
            outputArea.innerHTML = '';
            input.focus();
            return;
          default:
            output = `<span class="err-text">bash: ${cmd}: command not found</span>`;
        }

        if (output) {
          await typeWriterOutput(output);
        } else {
          input.focus();
        }
      }

      /* Window Controls */
      const btnClose = document.getElementById('btn-close');
      const btnMinimize = document.getElementById('btn-minimize');
      const btnMaximize = document.getElementById('btn-maximize');

      btnClose.addEventListener('click', () => {
        terminal.classList.add('closed');
        closedScreen.classList.add('active');
      });

      closedScreen.addEventListener('click', () => {
        terminal.classList.remove('closed');
        closedScreen.classList.remove('active');
        terminal.classList.remove('minimized');
        terminal.classList.remove('maximized');
        terminal.style.top = '';
        terminal.style.left = '';
        setTimeout(() => input.focus(), 100);
      });

      btnMinimize.addEventListener('click', (e) => {
        e.stopPropagation();
        terminal.classList.remove('maximized');
        terminal.classList.toggle('minimized');
        if (!terminal.classList.contains('minimized')) {
          setTimeout(() => input.focus(), 100);
        }
      });

      terminal.addEventListener('click', () => {
        if (terminal.classList.contains('minimized')) {
          terminal.classList.remove('minimized');
          setTimeout(() => input.focus(), 100);
        }
      });

      btnMaximize.addEventListener('click', (e) => {
        e.stopPropagation();
        terminal.classList.remove('minimized');
        terminal.classList.toggle('maximized');
        terminal.style.top = '';
        terminal.style.left = '';
        setTimeout(() => input.focus(), 100);
      });

      /* Draggable Logic */
      let isDragging = false;
      let dragStartX, dragStartY;
      let initialLeft, initialTop;

      terminalHeader.addEventListener('mousedown', (e) => {
        if (terminal.classList.contains('maximized') || terminal.classList.contains('minimized')) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;

        const rect = terminal.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        // Give absolute position to move freely, if not already set by JS
        terminal.style.left = initialLeft + 'px';
        terminal.style.top = initialTop + 'px';
        terminal.style.margin = '0';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;

        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        // Prevent dragging off screen out of bounds
        newTop = Math.max(0, Math.min(newTop, window.innerHeight - 50));
        newLeft = Math.max(-terminal.offsetWidth / 2, Math.min(newLeft, window.innerWidth - 100));

        terminal.style.left = newLeft + 'px';
        terminal.style.top = newTop + 'px';
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });

      /* Matrix Functionality */
      let matrixInterval;
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');

      function startMatrix() {
        canvas.style.display = 'block';
        terminal.style.display = 'none'; // hide terminal while matrix is running

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        function draw() {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#0F0'; // Green text
          ctx.font = fontSize + 'px monospace';

          for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
              drops[i] = 0;
            }
            drops[i]++;
          }
        }

        matrixInterval = setInterval(draw, 33);

        // Set escape handler for Matrix
        const stopMatrixHandler = (e) => {
          if (e.key === 'Escape' || e.type === 'click') {
            stopMatrix();
            document.removeEventListener('keydown', stopMatrixHandler);
            document.removeEventListener('click', stopMatrixHandler);
          }
        };

        // Add text hint
        setTimeout(() => {
          ctx.fillStyle = '#FFF';
          ctx.font = '20px monospace';
          ctx.fillText("Press ESC or click anywhere to exit", canvas.width / 2 - 180, 40);
        }, 1000);

        document.addEventListener('keydown', stopMatrixHandler);
        document.addEventListener('click', stopMatrixHandler);
      }

      function stopMatrix() {
        clearInterval(matrixInterval);
        canvas.style.display = 'none';
        terminal.style.display = 'flex';
        setTimeout(() => {
          scrollToBottom();
          input.focus();
        }, 100);
      }

      function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', currentTheme);
      }

      // Default theme based on user preference or hardcode to light as original
      document.body.setAttribute('data-theme', 'light');

      // Initial Positioning
      const rect = terminal.getBoundingClientRect();
      terminal.style.top = (window.innerHeight - rect.height) / 2 + 'px';
      terminal.style.left = (window.innerWidth - rect.width) / 2 + 'px';
    });
  </script>
</body>
